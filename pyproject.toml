[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "novel2img"
dynamic = ["version"]
description = "Turn novel chapters into illustrated storyboards with a local LLM (Ollama) and Stable Diffusion."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["novel", "storyboard", "stable-diffusion", "sdxl", "ollama", "llm", "text-to-image"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "torch>=2.4",
    "diffusers>=0.30",
    "transformers>=4.44",
    "accelerate>=0.33",
    "peft>=0.11",
    "safetensors>=0.4",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
novel2img = "novel2img.cli:main"

[tool.hatch.version]
path = "novel2img/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["novel2img"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
